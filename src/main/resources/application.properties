spring.application.name=finledger
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:finledger}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2s

finledger.rate-limit.transfer.enabled=${TRANSFER_RATE_LIMIT_ENABLED:true}
finledger.rate-limit.transfer.max-requests=${TRANSFER_RATE_LIMIT_MAX:20}
finledger.rate-limit.transfer.window-seconds=${TRANSFER_RATE_LIMIT_WINDOW_SECONDS:60}

finledger.security.jwt.secret=${JWT_SECRET}
finledger.security.jwt.issuer=${JWT_ISSUER:finledger}
finledger.security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}

finledger.ai.enabled=${AI_ENABLED:false}
finledger.ai.api-base-url=${AI_API_BASE_URL:https://api.openai.com/v1}
finledger.ai.api-key=${AI_API_KEY:}
finledger.ai.model=${AI_MODEL:gpt-5.4-nano}

finledger.risk.enabled=${RISK_ENABLED:true}
finledger.risk.high-amount-threshold=${RISK_HIGH_AMOUNT_THRESHOLD:50000.00}
finledger.risk.frequency-max-requests=${RISK_FREQUENCY_MAX_REQUESTS:5}
finledger.risk.frequency-window-seconds=${RISK_FREQUENCY_WINDOW_SECONDS:60}
finledger.risk.daily-limit=${RISK_DAILY_LIMIT:200000.00}
