spring.datasource.url=jdbc:mysql://127.0.0.1:65535/unused
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=127.0.0.1
spring.data.redis.port=65534
spring.data.redis.timeout=100ms

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false
mybatis-plus.global-config.db-config.id-type=auto

finledger.rate-limit.transfer.enabled=false
finledger.rate-limit.transfer.max-requests=20
finledger.rate-limit.transfer.window-seconds=60
finledger.security.jwt.secret=finledger_test_jwt_secret_at_least_32_bytes_long
finledger.security.jwt.issuer=finledger-test
finledger.security.jwt.ttl-seconds=3600
